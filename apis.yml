aid: agriful
name: Agriful
description: Agriful (Agriful Software Inc.) is a cloud ERP for the fresh produce industry, founded in
  2022 by Patrick Crowley (CEO) and Deep Randhawa (CTO) and backed by Fractal Software and Reservoir Ventures.
  Its web platform runs sales and purchase order entry, live inventory control, lot-level traceability
  for FSMA and PTI compliance, produce-specific AR/AP accounting and grower settlements, and customizable
  reporting for produce brokers, marketers, packer-shippers, wholesalers and distributors. As of this
  profile Agriful publishes no developer program, API reference, OpenAPI or GraphQL schema, SDK, CLI,
  Postman collection or webhook catalog. The single live machine surface on its domain is the RedwoodJS
  GraphQL endpoint at api.agrifulsoftware.com/graphql that backs its own single-page application; it
  answers anonymous requests but has introspection disabled in production and is documented nowhere.
